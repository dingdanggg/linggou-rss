name: 生成灵构 AI 资讯 RSS

on:
  schedule:
    # 工作日（周一到周五）北京时间 09:00 推送一次（UTC+8 = UTC 01:00）
    # 周一会自动拉取72小时内容（含周末）
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 RSS feed
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python generate_feed.py

      - name: 提交并推送 feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml meta.json social_topics.json || true
          git diff --cached --quiet || git commit -m "chore: 更新 RSS feed $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M CST')"
          git push

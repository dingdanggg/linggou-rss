name: 生成灵构 AI 资讯 RSS

on:
  schedule:
    # 每天北京时间 08:30、12:30、18:30 各跑一次（UTC 时间）
    - cron: "30 0 * * *"   # 北京 08:30
    - cron: "30 4 * * *"   # 北京 12:30
    - cron: "30 10 * * *"  # 北京 18:30
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 RSS feed
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python generate_feed.py

      - name: 提交并推送 feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml meta.json
          git diff --cached --quiet || git commit -m "chore: 更新 RSS feed $(date +'%Y-%m-%d %H:%M CST' -d '+8 hours')"
          git push
